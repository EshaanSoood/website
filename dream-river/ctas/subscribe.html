<div class="cta-card">
  <h4 class="cta-heading">Stay Up To Date</h4>
  <form class="dream-river-subscribe-form"
        action="#"
        method="post">
    <div class="ck-row">
      <input name="name" placeholder="Name" required />
      <input name="email_address" type="email" placeholder="Email Address" required />
      <button type="submit" class="cta-btn">Subscribe</button>
    </div>
  </form>
  <div class="cta-copy dream-river-subscribe-message" aria-live="polite"></div>
  <script>
    (function() {
      const form = document.currentScript.previousElementSibling.previousElementSibling;
      const message = document.currentScript.previousElementSibling;
      if (!form || !message) return;

      form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const name = form.querySelector('input[name="name"]').value.trim();
        const email = form.querySelector('input[name="email_address"]').value.trim();
        const button = form.querySelector('button[type="submit"]');

        message.textContent = '';
        button.disabled = true;

        try {
          const response = await fetch('https://lists.eshaansood.org/api/public/subscription', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email: email,
              name: name,
              list_uuids: ['16b78e1b-df6e-452e-929a-a1ad9d2ec2c5'],
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || 'Failed to subscribe');
          }

          message.textContent = 'Check your email to confirm your subscription.';
          form.reset();
        } catch (error) {
          message.textContent = error.message || 'Something went wrong. Please try again.';
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</div>
